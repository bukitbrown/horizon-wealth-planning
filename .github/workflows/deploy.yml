name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site files only
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/assets
          mkdir _site/hooks
          cp .claude/hooks/chatbot-greeting.js _site/hooks/
          sed -i 's#\.claude/hooks/chatbot-greeting\.js#hooks/chatbot-greeting.js#' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
